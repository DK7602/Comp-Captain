name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-24.04 }

    steps:
      - uses: actions/checkout@v5

      - name: Linux packages (JUCE needs these)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libxext-dev libcurl4-openssl-dev xvfb fluxbox

      - name: WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory "$env:USERPROFILE\AppData\Local\PackageManagement\NuGet\Packages"

      - name: Speech model (cached between runs)
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models
          key: whisper-ggml-base.en-q5_1

      - name: Download the speech model (English, MIT licence)
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models
          curl -sSL --retry 4 -o models/ggml-base.en-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q5_1.bin

      - name: Check the speech model is the right file
        shell: bash
        run: |
          echo "4baf70dd0d7c4247ba2b81fafd9c01005ac77c2f9ef064e00dcf195d0e2fdd2f  models/ggml-base.en-q5_1.bin" > models/sha256.txt
          if command -v sha256sum >/dev/null; then sha256sum -c models/sha256.txt; else shasum -a 256 -c models/sha256.txt; fi

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -S . -B build $GEN -DCMAKE_BUILD_TYPE=Release -DCC_WHISPER_MODEL="$PWD/models/ggml-base.en-q5_1.bin"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Engine tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Host test (loads the VST3 like a DAW)
        shell: bash
        run: |
          VST3="build/plugin/CompCaptain_artefacts/Release/VST3/Comp Captain.vst3"
          HOST=build/host-test/CompCaptainHostTest_artefacts/Release/CompCaptainHostTest
          if [ "$RUNNER_OS" = "Linux" ]; then
            # a small window manager, so the test window behaves like it does on a real desktop
            xvfb-run -a bash -c 'fluxbox >/dev/null 2>&1 & sleep 2; "$0" "$1"' "$HOST" "$VST3"
          else
            "$HOST" "$VST3"
          fi

      - name: Comp test (builds the comp and plays takes, with the plug-in's own code)
        shell: bash
        timeout-minutes: 15
        run: |
          COMP=build/host-test/CompCaptainCompTest_artefacts/Release/CompCaptainCompTest
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "$COMP"
          else
            "$COMP"
          fi

      - name: ARA test (a pretend DAW uses it as an Extension)
        shell: bash
        run: |
          VST3="build/plugin/CompCaptain_artefacts/Release/VST3/Comp Captain.vst3"
          ARA=build/host-test/CompCaptainAraTest_artefacts/Release/CompCaptainAraTest
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a bash -c 'fluxbox >/dev/null 2>&1 & sleep 2; "$0" "$1"' "$ARA" "$VST3"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # if it fails, run it again under the debugger so the log shows where
            "$ARA" "$VST3" || { lldb --batch -o run -k "bt 40" -k "quit 1" -- "$ARA" "$VST3"; exit 1; }
          else
            "$ARA" "$VST3"
          fi

      - name: Interface test (the window's messages, in a real browser)
        if: runner.os == 'Linux'
        working-directory: tests/ui
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node bridge-test.js

      - name: Gather the files to install
        shell: bash
        run: |
          A=build/plugin/CompCaptain_artefacts/Release
          mkdir -p dist
          cp -R "$A/VST3/Comp Captain.vst3" dist/
          if [ "$RUNNER_OS" = "Windows" ]; then cp "$A/Standalone/Comp Captain.exe" dist/; fi
          if [ "$RUNNER_OS" = "macOS" ]; then cp -R "$A/Standalone/Comp Captain.app" dist/; cp -R "$A/AU/Comp Captain.component" dist/; fi
          if [ "$RUNNER_OS" = "Linux" ]; then cp "$A/Standalone/Comp Captain" dist/; fi
          cp INSTALL.txt THIRD_PARTY_NOTICES.txt dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Comp Captain - ${{ matrix.name }}
          path: dist/
          if-no-files-found: error
